services:
  api:
    build:
      context: ./apps/api
    environment:
      APP_ENV: development
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://web:3000
      MARKET_DATA_PROVIDER: sample
      BROKER_PROVIDER: ${BROKER_PROVIDER:-internal_sandbox}
      BROKER_MODE: ${BROKER_MODE:-sandbox}
      ENABLE_LIVE_TRADING: ${ENABLE_LIVE_TRADING:-false}
      MAX_ORDER_NOTIONAL: ${MAX_ORDER_NOTIONAL:-25000}
      MAX_ORDER_QUANTITY: ${MAX_ORDER_QUANTITY:-100}
      ALLOWED_TRADE_SYMBOLS: ${ALLOWED_TRADE_SYMBOLS:-SPY,QQQ,AAPL}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ALPACA_API_KEY_ID: ${ALPACA_API_KEY_ID:-}
      ALPACA_API_SECRET_KEY: ${ALPACA_API_SECRET_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build:
      context: ./.devcontainer
    working_dir: /workspace
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - .:/workspace
    command: sh -c "corepack enable && pnpm install && pnpm --filter @ai-quant-lab/web dev"
    depends_on:
      - api

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quant}
      POSTGRES_DB: ${POSTGRES_DB:-quant_lab}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
